<title>Домашнее меню</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Nunito:wght@400;600;700;800&family=Unbounded:wght@500;700&family=Caveat:wght@600;700&display=swap">
<style>
/* Layout: печатное меню на тёплой бумаге. Крупный жирный заголовок, персиковая шапка с рисованным блюдом, цветные плашки разделов, строки с пунктирной линией до стрелки, у каждой группы своя иллюстрация. Один светлый вид, без тёмной темы. */
:root{
  color-scheme:light;
  --paper:#FCF3E6; --paper-2:#F6E6D1; --card:#FFFAF2; --ink:#3B2418; --muted:#8A6B58; --line:#E6D0B8; --dot:#B98F70;
  --accent:#D2553A; --accent-d:#B3412B; --on-accent:#FFF8EF;
  --peach:#F9D8BA; --salmon:#F6BDA4; --butter:#F9E3A6; --rose:#F4CBC6; --sand:#EDDABF; --olive:#E4E2B4;
  --tint-a:#FBE3DC; --tint-b:#FBF0D2;
  --shadow:rgba(90,45,25,.22);
  --f-head:'Dela Gothic One','Unbounded',Impact,'Arial Black',sans-serif;
  --f-ui:'Unbounded','Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-body:'Nunito',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html.lock{overflow:hidden}
body{background:var(--paper);color:var(--ink);font:16px/1.5 var(--f-body);-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0;text-align:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3,h4,p,ul,ol{margin:0}
ul,ol{padding:0;list-style:none}
svg{display:block}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* top bar and tabs */
.top-in{display:flex;align-items:center;justify-content:space-between;gap:12px 16px;padding-block:14px 4px}
.brand{font-family:var(--f-head);font-size:clamp(22px,5.7vw,29px);line-height:1;color:var(--accent)}
.search{position:relative;flex:0 1 220px;min-width:0}
.search svg.si{position:absolute;left:12px;top:50%;translate:0 -50%;color:var(--muted);pointer-events:none}
.search input{width:100%;font:inherit;font-size:15px;color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:999px;padding:7px 34px;min-width:0}
.search input::placeholder{color:var(--muted)}
.search input::-webkit-search-cancel-button{display:none}
.search .clr{position:absolute;right:3px;top:50%;translate:0 -50%;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:var(--muted)}
.navband{position:sticky;top:env(safe-area-inset-top,0px);z-index:8;background:var(--paper)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-block:8px 12px;scrollbar-width:none;scroll-snap-type:x proximity}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;scroll-snap-align:start;white-space:nowrap;font-family:var(--f-ui);font-weight:500;font-size:15.5px;padding:11px 19px;border-radius:999px;background:var(--paper-2);color:var(--ink)}
.tab:hover{background:var(--peach)}
.tab[aria-current="page"]{background:var(--accent);color:var(--on-accent);font-weight:700}
main{padding-block:6px 64px;min-height:60vh}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-family:var(--f-ui);font-weight:600;letter-spacing:-.01em;border-radius:999px;padding:13px 22px;font-size:13px;transition:background .15s,transform .15s}
.btn:hover{transform:translateY(-1px)}
.btn.cta{background:var(--accent);color:var(--on-accent)}
.btn.cta:hover{background:var(--accent-d)}
.btn.line{border:1.5px solid var(--accent);color:var(--accent-d);background:transparent;padding:9px 16px;font-size:11.5px}
.btn.line:hover{background:var(--accent);color:var(--on-accent)}
.btn.soft{background:var(--paper-2);color:var(--ink)}
.btn.block{width:100%}

/* home hero */
.hero{position:relative;display:grid;grid-template-columns:1fr minmax(160px,300px);align-items:center;gap:8px 20px;background:var(--peach);border-radius:34px;padding:34px clamp(22px,4vw,48px);margin-top:6px;overflow:hidden}
.hero .eyebrow{font-family:var(--f-ui);font-size:11px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--accent-d);margin-bottom:10px}
.hero h1{font-family:var(--f-head);font-weight:400;font-size:clamp(34px,8vw,68px);line-height:1;color:var(--accent);text-wrap:balance;margin-bottom:24px}
.hero .art{width:100%;max-width:300px;justify-self:end;rotate:-4deg}
@media (max-width:560px){.hero{grid-template-columns:1fr;padding:26px 20px 22px}.hero .art{max-width:170px;justify-self:end;margin-top:-70px;margin-bottom:-6px}.hero .copy{position:relative;z-index:1}}
.ribbon{overflow:hidden;margin-top:18px;padding:8px 0}
.ribbon .track{display:flex;width:max-content;animation:rb 200s linear infinite}
.ribbon .seg{display:flex;align-items:center;gap:14px;padding-right:14px;white-space:nowrap;font-family:var(--f-ui);font-weight:500;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.ribbon .seg b{color:var(--accent);font-weight:500}
@keyframes rb{to{transform:translateX(-50%)}}
@media (prefers-reduced-motion:reduce){.ribbon .track{animation:none}}
.sec-title{display:flex;align-items:center;gap:16px;margin:22px 0 14px}
.sec-title h2{font-family:var(--f-head);font-weight:400;font-size:22px;color:var(--ink)}
.sec-title i{flex:1;border-bottom:2px dotted var(--dot);opacity:.7}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media (min-width:640px){.tiles{grid-template-columns:repeat(3,1fr);gap:16px}}
.tile{position:relative;display:flex;align-items:flex-end;min-height:176px;background:var(--tb);border-radius:28px;padding:18px;overflow:hidden;transition:transform .15s}
.tile:hover{transform:translateY(-3px)}
.tile .tt{position:relative;z-index:1;font-family:var(--f-head);font-size:clamp(17px,4.2vw,23px);line-height:1.05;color:var(--ink)}
.tile .tart{position:absolute;right:18px;top:50%;translate:0 -58%;width:min(46%,120px);rotate:0deg}
.p0{--tb:var(--butter)}.p1{--tb:var(--peach)}.p2{--tb:var(--salmon)}.p3{--tb:var(--sand)}.p4{--tb:var(--olive)}.p5{--tb:var(--rose)}

/* category pages */
.pagehead{display:flex;align-items:center;gap:14px;margin:14px 0 6px}
.pagehead .emb{width:76px;flex:none}
.pagehead h2{font-family:var(--f-head);font-weight:400;font-size:clamp(28px,7vw,46px);line-height:1;color:var(--accent)}
.pagehead .btn{margin-left:auto}
@media (max-width:520px){.pagehead{flex-wrap:wrap}.pagehead .btn{margin-left:0}}
.split{display:grid;grid-template-columns:1fr;gap:14px;margin-top:14px}
@media (min-width:820px){.split{grid-template-columns:1fr 1fr;gap:18px}}
.col{min-width:0;border-radius:32px;padding:22px 20px 14px}
.col.sweet,.col.day{background:var(--tint-a)}
.col.salty{background:var(--tint-b)}
.sect{display:flex;align-items:center;gap:14px;margin-bottom:6px}
.sect span{font-family:var(--f-head);font-size:26px;line-height:1;color:var(--ink)}
.sect i{flex:1;border-bottom:2px dotted var(--dot)}
.group{margin-top:14px}
.ghead{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:84px}
.gpill{display:inline-block;font-family:'Caveat','Nunito',cursive;font-weight:700;font-size:23px;letter-spacing:.02em;line-height:1.2;padding:9px 22px;border-radius:999px;background:var(--gc);color:var(--ink)}
.gart{width:92px;flex:none;rotate:5deg}
.g0{--gc:var(--peach)}.g1{--gc:var(--salmon)}.g2{--gc:var(--butter)}.g3{--gc:var(--rose)}.g4{--gc:var(--olive)}
.rows{display:block}
.row{position:relative;border-top:0}
.ritem{display:flex;align-items:baseline;gap:10px;width:100%;padding:11px 2px;border-radius:10px}
.ritem .nm{font-weight:800;font-size:17px;line-height:1.3}
.ritem .nm small{display:block;font-weight:600;font-size:13px;color:var(--muted)}
.ritem .lead{flex:1;min-width:14px;border-bottom:2px dotted var(--dot);opacity:.75;translate:0 -4px}
.ritem svg{flex:none;color:var(--accent);translate:0 4px}
.ritem:hover .nm{color:var(--accent-d)}
.row.open{z-index:40}
.pair{position:relative;margin:-2px 0 8px 2px}
.popbtn{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-ui);border:1.5px solid var(--accent);color:var(--accent-d);font-weight:600;font-size:10.5px;padding:6px 12px;border-radius:999px;background:var(--card)}
.popbtn:hover{background:var(--accent);color:var(--on-accent)}
.pop{position:absolute;left:0;top:calc(100% - 2px);z-index:20;width:min(300px,calc(100vw - 56px));background:var(--card);border:1.5px solid var(--line);border-radius:20px;padding:12px 16px 14px;box-shadow:0 16px 36px var(--shadow)}
.pop::before{content:"";position:absolute;left:0;right:0;top:-10px;height:10px}
.pop h4{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:800;margin-bottom:6px}
.pop li{padding:4px 0;font-weight:700;font-size:15px}
.pop li::before{content:"· ";color:var(--accent);font-weight:800}
.pop li button{text-decoration:underline;text-decoration-color:var(--line);text-decoration-thickness:2px;text-underline-offset:3px;text-align:left}
.pop li button:hover{text-decoration-color:var(--accent)}
.empty{background:var(--card);border-radius:22px;padding:22px;color:var(--muted);margin-top:14px}
.results{background:var(--card);border-radius:28px;padding:10px 20px 14px;margin-top:8px}

/* modal */
.overlay{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;background:rgba(59,36,24,.5);padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet{position:relative;width:min(560px,100%);max-height:100%;overflow-y:auto;overflow-x:hidden;overflow-wrap:anywhere;background:var(--card);border-radius:30px;padding:14px 24px 26px;box-shadow:0 24px 60px rgba(40,20,10,.4);outline:0}
.sh-bar{display:flex;justify-content:space-between;align-items:center;min-height:40px;margin-bottom:6px}
.icon-btn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--paper-2);color:var(--ink)}
.top-row{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.top-row .txt{min-width:0}
.top-row .art{width:96px;flex:none;rotate:5deg;margin-top:-6px}
.kicker{display:inline-block;background:var(--gc,var(--peach));color:var(--ink);font-weight:800;font-size:13px;padding:3px 12px;border-radius:999px}
.sheet h2{font-family:var(--f-head);font-weight:400;font-size:clamp(24px,6vw,32px);line-height:1.1;color:var(--accent);margin:10px 0 14px;text-wrap:balance;outline:0}
.sheet .cta{margin-bottom:6px}
.lab{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:800;margin:18px 0 4px}
.ings li{display:flex;align-items:baseline;gap:10px;padding:8px 0}
.ings li .n{font-weight:700}
.ings li .l{flex:1;min-width:12px;border-bottom:2px dotted var(--dot);opacity:.7;translate:0 -4px}
.ings li .a{font-weight:800;text-align:right;max-width:52%}
.kcal{display:inline-flex;align-items:baseline;gap:8px;background:var(--butter);border-radius:999px;padding:9px 20px;margin-top:14px}
.kcal b{font-family:var(--f-head);font-weight:400;font-size:24px;line-height:1}
.kcal span{font-weight:800;font-size:14px}
.addons{display:flex;flex-wrap:wrap;gap:8px}
.addons li button,.addons li span{display:block;border:1.5px solid var(--line);padding:5px 13px;border-radius:999px;font-size:15px;font-weight:700}
.addons li button:hover{border-color:var(--accent);background:var(--tint-a)}
.steps{counter-reset:s;margin-bottom:12px}
.steps li{counter-increment:s;display:grid;grid-template-columns:34px 1fr;gap:12px;padding:11px 0;border-top:1.5px dotted var(--line)}
.steps li:first-child{border-top:0}
.steps li::before{content:counter(s);width:30px;height:30px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font-family:var(--f-ui);font-weight:700;font-size:12px}
.cats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:6px}
.cats button{position:relative;overflow:hidden;min-height:92px;font-family:var(--f-head);font-size:16px;line-height:1.1;background:var(--tb);border-radius:22px;padding:14px;display:flex;align-items:flex-end}
.cats button span.t{position:relative;z-index:1}
.cats button .ca{position:absolute;right:-4px;top:-2px;width:64px;rotate:6deg}
.cats button:hover{transform:translateY(-2px)}
.res-art{width:140px;margin:6px auto 4px;rotate:-3deg}
.stack{display:flex;flex-direction:column;gap:10px;margin-top:6px}
.preview{color:var(--muted);margin-bottom:8px}
@media (max-width:560px){
  .overlay{align-items:flex-end;padding:env(safe-area-inset-top,0px) 0 0}
  .sheet{width:100%;border-radius:30px 30px 0 0;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));padding-bottom:calc(26px + env(safe-area-inset-bottom,0px))}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}.tile:hover,.btn:hover,.cats button:hover{transform:none}}

/* уют */
:root{--cloth:linear-gradient(rgba(210,85,58,.032) 50%,transparent 50%),linear-gradient(90deg,rgba(210,85,58,.032) 50%,transparent 50%)}
body,.navband{background-image:var(--cloth);background-size:44px 44px;background-attachment:fixed}
.hero{padding-top:64px}
.bunting{position:absolute;left:0;top:14px;width:100%;height:40px;pointer-events:none}
.hero::after,.tile::after{content:"";position:absolute;inset:8px;border:2px dashed rgba(255,255,255,.75);border-radius:calc(34px - 8px);pointer-events:none}
.tile::after{border-radius:20px;border-color:rgba(255,255,255,.6)}
.bon{display:flex;align-items:center;justify-content:center;gap:8px;margin:34px 0 8px;font-family:var(--f-head);font-size:15px;color:var(--accent)}
.bon svg{color:var(--accent)}

.bon{font-family:'Caveat','Nunito',cursive;font-weight:600;font-size:30px;gap:10px;margin-top:30px}
.ritem{margin:0 -8px;padding:11px 8px;width:calc(100% + 16px);transition:background .15s}
.ritem:hover{background:rgba(210,85,58,.07)}
.tile .tart{transition:rotate .25s,scale .25s}
.tile:hover .tart{rotate:-5deg;scale:1.06}
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
#app>*{animation:up .4s ease both}
#app>*:nth-child(2){animation-delay:.05s}#app>*:nth-child(3){animation-delay:.1s}#app>*:nth-child(4){animation-delay:.15s}
@media (prefers-reduced-motion:reduce){#app>*{animation:none}}
.tile .tart svg{overflow:visible}
.sec-title h2::after,.pagehead h2::after{content:'';display:inline-block;width:38px;height:24px;margin-left:10px;background:url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2044%2028%22%3E%3Cpath%20d%3D%22M2%2020C14%2020%2026%2016%2040%206%22%20fill%3D%22none%22%20stroke%3D%22%23B98F70%22%20stroke-width%3D%222%22%20stroke-linecap%3D%22round%22/%3E%3Cpath%20d%3D%22M12%2019c-2-7%202-11%207-11%201%206-2%2010-7%2011zM22%2015c0-7%205-10%2010-9-1%206-4%209-10%209zM26%2018c4%201%208%203%2010%208-6%200-10-3-10-8z%22%20fill%3D%22%23F2C9A0%22%20stroke%3D%22%23B98F70%22%20stroke-width%3D%221.6%22%20stroke-linejoin%3D%22round%22/%3E%3C/svg%3E") center/contain no-repeat;vertical-align:-2px}
.pagehead h2::after{width:44px;height:28px}

.pairs{display:flex;flex-wrap:wrap;gap:0 8px}
.kvw{display:block;margin-top:14px}
.kvw .kcal{margin-top:0;align-items:center}
.kvb{cursor:pointer;font:inherit;color:inherit;text-align:left}
.kvb em{font-style:normal;font-family:var(--f-ui);font-size:10px;font-weight:600;border:1.5px solid var(--accent);color:var(--accent-d);border-radius:999px;padding:3px 9px;background:var(--card)}
.kvpop{position:static;margin-top:10px;background:var(--card);border:1.5px solid var(--line);border-radius:20px;padding:12px 16px 14px;box-shadow:0 16px 36px var(--shadow)}
.kvpop h4{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:800;margin-bottom:6px}
.kvpop li{display:flex;justify-content:space-between;gap:14px;padding:5px 0;font-weight:700;font-size:15px;border-top:1.5px dotted var(--line)}
.kvpop li:first-of-type{border-top:0}
.kvpop li b{white-space:nowrap;color:var(--accent-d)}
.tips{display:grid;gap:8px}
.tips li{background:var(--tint-a);border-radius:16px;padding:10px 14px;font-weight:700;font-size:15px}
.ings li .a{white-space:normal;overflow-wrap:normal;word-break:normal;max-width:56%;flex:0 1 auto;text-align:right}
.ings li .n{min-width:36%;overflow-wrap:normal;word-break:normal;flex:0 1 auto}
.plqs{margin-top:12px}
.plq{margin-top:8px}
.plq summary{list-style:none;display:inline-flex;align-items:center;gap:6px;cursor:pointer;font-family:var(--f-ui);border:1.5px solid var(--accent);color:var(--accent-d);font-weight:600;font-size:12px;padding:8px 15px;border-radius:999px;background:var(--card)}
.plq summary::-webkit-details-marker{display:none}
.plq summary:hover,.plq[open] summary{background:var(--accent);color:var(--on-accent)}
.plq>ul{margin-top:10px}
.plqrow{display:flex;flex-wrap:wrap;gap:8px}
.plqb{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-ui);border:1.5px solid var(--accent);color:var(--accent-d);font-weight:600;font-size:12px;padding:8px 15px;border-radius:999px;background:var(--card)}
.plqb:hover,.plqb[aria-expanded="true"]{background:var(--accent);color:var(--on-accent)}
.plqp{margin-top:10px}
.srvrow{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:6px}
.srvrow .lab{margin:18px 0 4px}
.srv{display:inline-flex;align-items:center;gap:8px;margin-top:12px;font-weight:800;font-size:14px}
.srv button{width:32px;height:32px;border-radius:50%;border:1.5px solid var(--accent);color:var(--accent-d);font-size:20px;line-height:1;display:grid;place-items:center;background:var(--card)}
.srv button:hover{background:var(--accent);color:var(--on-accent)}
.srv span{min-width:76px;text-align:center}
</style>
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false"><defs><filter id="wob" x="-8%" y="-8%" width="116%" height="116%"><feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="4" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="3.4"/></filter></defs></svg>
<header>
  <div class="wrap top-in">
    <button class="brand" type="button" data-act="route" data-route="home">Домашнее меню</button>
    <form class="search" role="search" id="sform" autocomplete="off">
      <svg class="si" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5" fill="none" stroke="currentColor" stroke-width="2.4"/><path d="M16 16l4.5 4.5" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
      <input id="q" type="search" placeholder="Поиск" aria-label="Поиск по блюдам и ингредиентам" enterkeyhint="search">
      <button class="clr" id="qclr" type="button" aria-label="Очистить поиск" hidden><svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" fill="none"/></svg></button>
    </form>
  </div>
</header>
<div class="navband"><div class="wrap"><nav class="tabs" id="tabs" aria-label="Разделы меню"></nav></div></div>
<main class="wrap" id="app"></main>

<div class="overlay" id="modal" hidden>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="mtitle" tabindex="-1"></div>
</div>

const ALT={'картош':['картофе'],'картофе':['картош'],'творог':['творож'],'творож':['творог'],'туне':['тунц'],'тунц':['туне']};
function stem(w){return w.length>=6?w.slice(0,-2):(w.length>=4?w.slice(0,-1):w);}
function hit(w,arr){const s=stem(w);const vs=[s].concat(ALT[s]||[]);return vs.some(v=>arr.some(x=>x.startsWith(v)));}
function searchHTML(){
  const ws=words(query); let res=[];
  if(ws.length){
    CATS.forEach(c=>c.all.forEach(d=>{
      const all=d._nw.concat(d._iw);
      if(ws.every(w=>hit(w,all))){
        const inName=ws.every(w=>hit(w,d._nw)); let why='';
        if(!inName){const ing=d.ing.find(i=>hit(ws[0],words(i))); why=ing?(' · в составе: '+ing):'';}
        res.push({d,inName,why});
      }
    }));
    res.sort((a,b)=>(b.inName-a.inName));
  }
  const head='<div class="pagehead"><h2>Поиск</h2></div>';
  if(!res.length) return head+'<div class="empty">Ничего не нашлось по запросу «'+esc(query.trim())+'». Попробуйте другое слово, например «курица», «сыр» или «гречка».</div>';
  return head+'<ul class="results rows">'+res.map(r=>rowHTML(r.d,r.d.cat.tab+r.why)).join('')+'</ul>';
}

let stackV=[], lastFocus=null; const queues={};
function nextRandom(catId,cur,sec){
  const key=catId+'|'+(sec||''); let q=queues[key];
  if(!q||!q.length){q=shuffle(byCat[catId].all.filter(d=>!sec||d.group.section===sec).map(d=>d.id)); if(q.length>1&&q[q.length-1]===cur) q.unshift(q.pop()); queues[key]=q;}
  return q.pop();
}
function openModal(view){

}
function closeModal(){
  if(modal.hidden) return;

}

const srv={};
const nb=s=>s.replace(/(\d) (?=[а-яёa-z])/gi,'$1\u00a0');
function rnd(v){ if(v>=100) return Math.round(v/5)*5; if(v>=10) return Math.round(v); if(v>=1) return Math.round(v*2)/2; return Math.round(v*4)/4||0.25; }
const fmt=v=>String(v).replace('.',',');
const plural=(n,a,b,c)=>{ if(n!==Math.floor(n)) return b; const m=n%100,k=n%10; if(m>10&&m<15) return c; if(k===1) return a; if(k>=2&&k<=4) return b; return c; };
const FORMS=[['зубчик',['зубчик','зубчика','зубчиков']],['ломтик',['ломтик','ломтика','ломтиков']],['банк',['банка','банки','банок']],['листа',['лист','листа','листьев']],['лист',['лист','листа','листьев']],['тушк',['тушка','тушки','тушек']],['головк',['головка','головки','головок']],['упаковк',['упаковка','упаковки','упаковок']],['пачк',['пачка','пачки','пачек']]];
function scaleAmt(s,k){
  if(k===1) return s;
  return s.replace(/(\d+(?:[.,]\d+)?)(\s*)([а-яё]+)?/gi,(m,num,sp,word)=>{
    const v=rnd(parseFloat(num.replace(',','.'))*k);
    if(word){ for(const f of FORMS){ if(word.toLowerCase().startsWith(f[0])) return fmt(v)+sp+plural(v,f[1][0],f[1][1],f[1][2]); } }
    return fmt(v)+(sp||'')+(word||'');
  });
}

      CATS.map((c,i)=>'<button class="p'+i+'" type="button" data-act="pickcat" data-cat="'+c.id+'"><span class="ca">'+A[EMB[c.id]]+'</span><span class="t">'+esc(c.tab)+'</span></button>').join('')+'</div>';
  }else if(v.type==='pickdin'){
    h+='<span class="kicker g2">Ужин</span><h2 id="mtitle" tabindex="-1">На неделю или на день?</h2><div class="cats">'+
      '<button class="p0" type="button" data-act="randsec" data-sec="На неделю"><span class="ca">'+A.penne+'</span><span class="t">На неделю</span></button>'+
      '<button class="p1" type="button" data-act="randsec" data-sec="На день"><span class="ca">'+A.dinner+'</span><span class="t">На день</span></button></div>';
  }else if(v.type==='result'){
    const d=byId[v.id];
    h+='<span class="kicker g'+(d.gi%5)+'">'+esc(d.cat.tab+(v.sec?' · '+v.sec:''))+'</span><div class="res-art">'+artG(d.cat,d.group)+'</div><h2 id="mtitle" tabindex="-1">'+esc(d.name)+'</h2>'+
      '<p class="preview">'+esc(d.ing.slice(0,6).join(', ')+(d.ing.length>6?' и другое':''))+'</p><div class="stack">'+
      '<button class="btn cta block" type="button" data-act="other" data-cat="'+d.cat.id+'" data-sec="'+(v.sec||'')+'">Другое блюдо</button>'+
      '<button class="btn soft block" type="button" data-act="dish" data-id="'+d.id+'">Состав и рецепт</button>'+
      (stackV.length>1?'<button class="btn soft block" type="button" data-act="back">Другой раздел</button>':'')+'</div>';
  }
  sheet.innerHTML=h; sheet.scrollTop=0;
  const t=sheet.querySelector('h2'); if(t) t.focus({preventScroll:true});
}

/* ---------- события ---------- */
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]');
  if(!t){ if(!e.target.closest('.pop')) closePops(); if(e.target===modal) closeModal(); return; }
  const a=t.dataset.act;
  if(a!=='pop') closePops();
  switch(a){
    case 'route': go(t.dataset.route); break;
    case 'dish': openModal({type:'dish',id:t.dataset.id}); break;
    case 'recipe': openModal({type:'recipe',id:t.dataset.id}); break;
    case 'random': openModal({type:'pick'}); break;
    case 'randcat': case 'pickcat': if(t.dataset.cat==='dinner') openModal({type:'pickdin'}); else openModal({type:'result',id:nextRandom(t.dataset.cat,null)}); break;
    case 'randsec': openModal({type:'result',id:nextRandom('dinner',null,t.dataset.sec),sec:t.dataset.sec}); break;
    case 'other': { const cur=stackV[stackV.length-1].id, sec=t.dataset.sec||undefined; stackV[stackV.length-1]={type:'result',id:nextRandom(t.dataset.cat,cur,sec),sec:sec}; renderModal(); break; }
    case 'back': if(stackV.length>1){stackV.pop();renderModal();} break;
    case 'close': closeModal(); break;
    case 'srv': { const dd=byId[t.dataset.id]; const cur=srv[dd.id]||dd.base; srv[dd.id]=Math.max(1,Math.min(12,cur+(+t.dataset.d)));
      const box=t.closest('.ingbox'); const lab=box.querySelector('.lab').textContent; const tmp=document.createElement('div'); tmp.innerHTML=ingBox(dd,lab); box.replaceWith(tmp.firstChild); break; }
    case 'plq': { const box=t.closest('.plqs'); const open=t.getAttribute('aria-expanded')==='true';
      box.querySelectorAll('.plqb').forEach(b=>b.setAttribute('aria-expanded','false')); box.querySelectorAll('.plqp').forEach(p=>p.hidden=true);
      if(!open){ t.setAttribute('aria-expanded','true'); box.querySelector('.plqp[data-p="'+t.dataset.t+'"]').hidden=false; } break; }
    case 'kv': { const w=t.closest('.kvw'),p=w.querySelector('.kvpop'); p.hidden=!p.hidden; t.setAttribute('aria-expanded',p.hidden?'false':'true'); if(!p.hidden) setTimeout(()=>p.scrollIntoView({block:'nearest',behavior:'smooth'}),30); break; }
    case 'pop': { const p=t.closest('.pair'); const open=!p.querySelector('.pop').hidden;
      if(open&&p.dataset.pinned==='1') setPop(p,false); else {closePops(p);setPop(p,true,true);} break; }
  }
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){ if(!modal.hidden) closeModal(); else closePops(); return; }
  if(e.key==='Tab'&&!modal.hidden){
    const f=[...sheet.querySelectorAll('button,[href],input,[tabindex]:not([tabindex="-1"])')].filter(x=>!x.disabled);
    if(!f.length) return;
    const first=f[0], last=f[f.length-1];
    if(!sheet.contains(document.activeElement)){first.focus();e.preventDefault();}
    else if(e.shiftKey&&document.activeElement===first){last.focus();e.preventDefault();}
    else if(!e.shiftKey&&document.activeElement===last){first.focus();e.preventDefault();}
  }
});
$('#sform').addEventListener('submit',e=>e.preventDefault());
qIn.addEventListener('input',()=>{query=qIn.value; qClr.hidden=!query; render();});
qClr.addEventListener('click',()=>{query=''; qIn.value=''; qClr.hidden=true; render(); qIn.focus();});

buildTabs(); render();
})();
</script>
